name: Promote Approved Cinema Discoveries
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinema-catalog-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Append approved candidates only
        run: python scripts/promote_approved.py
      - name: Commit updated catalog and backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/catalogo-cinema-mestre-sanitizado.json data/catalog/backups/
          git commit -m "Promote approved Cinema discoveries"
          git push
