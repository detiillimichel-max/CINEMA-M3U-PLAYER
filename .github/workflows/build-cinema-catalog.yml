name: Build Cinema Catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cinema.txt"
      - "scripts/build_catalog.py"
      - ".github/workflows/build-cinema-catalog.yml"
permissions:
  contents: write
concurrency:
  group: cinema-catalog-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate master catalog
        run: python scripts/build_catalog.py
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/catalogo-cinema.json
          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
          else
            git commit -m "Build Cinema master catalog"
            git push
          fi
