name: Cinema Discovery Review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/discovery/inbox/**"
      - "data/discovery/approved.json"
      - "scripts/discover_catalog.py"
permissions:
  contents: write
concurrency:
  group: cinema-discovery-review
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compare incoming libraries
        run: python scripts/discover_catalog.py
      - name: Save review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/review-candidates.json
          if git diff --cached --quiet; then
            echo "No discovery report changes."
          else
            git commit -m "Update Cinema discovery review"
            git push
          fi
