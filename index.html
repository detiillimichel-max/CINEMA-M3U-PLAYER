<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116"><meta name="description" content="Biblioteca pessoal de vídeos a partir de playlists M3U.">
<link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./css/style.css">
<title>Cinema M3U Player</title>
</head>
<body>
<header class="topbar"><a class="brand" href="./">🎬 <span>CINEMA</span><small>M3U PLAYER</small></a><div class="top-actions"><button id="reloadBtn" class="icon-btn" title="Atualizar catálogo" aria-label="Atualizar catálogo">↻</button><button id="adminOpen" class="icon-btn" title="Área privada" aria-label="Área privada">⚙</button></div></header>
<main>
<section class="hero"><div><p class="eyebrow">SUA BIBLIOTECA</p><h1>Seu cinema,<br><span>do seu jeito.</span></h1><p id="statusText">Carregue uma playlist para começar.</p></div></section>
<section class="player-section" id="playerSection" hidden><div class="player-wrap"><video id="videoPlayer" controls playsinline preload="metadata"></video></div><div class="now-playing"><div><small>REPRODUZINDO</small><h2 id="nowTitle">Selecione um título</h2></div><button id="closePlayer" class="icon-btn" aria-label="Fechar player">×</button></div><p id="playerMessage" class="hint"></p></section>
<section class="toolbar"><input id="searchInput" type="search" placeholder="Buscar filmes, séries e episódios..." autocomplete="off"><select id="categoryFilter" aria-label="Filtrar categoria"><option value="Todos">Todas as categorias</option></select><select id="sortFilter" aria-label="Ordenar"><option value="name">Nome A–Z</option><option value="recent">Adicionados recentemente</option></select></section>
<nav class="tabs" aria-label="Filtros rápidos"><button class="tab active" data-view="all">Tudo</button><button class="tab" data-view="movies">Filmes</button><button class="tab" data-view="series">Séries</button><button class="tab" data-view="favorites">♥ Favoritos</button><button class="tab" data-view="history">Histórico</button></nav>
<section class="catalog-head"><div><h2 id="catalogTitle">Catálogo</h2><p id="countText">0 títulos</p></div></section>
<section id="catalog" class="catalog-grid" aria-live="polite"></section><button id="loadMore" class="secondary-btn" hidden>Carregar mais</button>
</main>
<footer>Biblioteca pessoal • Reproduza somente conteúdos que você tem autorização para acessar.</footer>
<dialog id="adminDialog"><form method="dialog" class="dialog-close"><button class="icon-btn" aria-label="Fechar">×</button></form><section id="adminContent"></section></dialog>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script><script type="module" src="./js/app.js"></script>
</body></html>
